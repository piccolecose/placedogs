name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Threshold lives in .cargo/config.toml (`cargo cov`).
      - name: Tests with coverage
        run: |
          set -o pipefail
          cargo cov --locked | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage.txt ] || exit 0
          total=$(awk '/^TOTAL/ {print $10}' coverage.txt)
          echo "Total line coverage: ${total}"
          {
            echo "## Coverage: ${total} lines"
            echo '```'
            sed -n '/^Filename/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
